name: refresh

# Data sources publish quarterly; a conservative monthly check is enough.
# The workflow produces artifacts + a summary; it does NOT auto-commit —
# dataset changes are reviewed before merging.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 5 * *"   # monthly, day 5, 06:00 UTC

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch + parse all entities
        run: |
          for e in renta4 unicaja caixabank santander; do
            uv run psd2-kpi-es ingest "$e" || true
          done

      - name: Generate report
        run: uv run psd2-kpi-es report

      - name: Upload dataset artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: |
            data/normalized/
            dist/
            reports/
          retention-days: 90

      - name: Summary
        run: uv run psd2-kpi-es coverage >> "$GITHUB_STEP_SUMMARY"
