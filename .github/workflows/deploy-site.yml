name: deploy-site

# Deploys ONLY reviewed dataset versions — this workflow never touches
# live sources. refresh.yml ingests and produces artifacts for human
# review; the accepted dataset is attached to a GitHub release
# (observations.parquet, sources.parquet, SHA256SUMS). Here we download a
# released dataset, verify its checksums, build the static site and rsync
# it to the VPS. What the site shows = a reviewed dataset version.
#
# Secrets/vars documented in docs/deploy.md.

on:
  workflow_dispatch:
    inputs:
      dataset_ref:
        description: Release tag providing the dataset (empty = latest release with dataset assets)
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Resolve dataset release
        id: ds
        env:
          REF: ${{ inputs.dataset_ref || github.event.release.tag_name }}
        run: |
          has_assets() {
            names="$(gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null)"
            printf '%s\n' "$names" | grep -qx 'observations.parquet' \
              && printf '%s\n' "$names" | grep -qx 'sources.parquet' \
              && printf '%s\n' "$names" | grep -qx 'SHA256SUMS'
          }
          if [ -n "$REF" ] && ! has_assets "$REF"; then
            echo "release $REF has no dataset assets — falling back"
            REF=""
          fi
          if [ -z "$REF" ]; then
            for tag in $(gh release list --limit 20 --json tagName --jq '.[].tagName'); do
              if has_assets "$tag"; then REF="$tag"; break; fi
            done
          fi
          test -n "$REF" || { echo "::error::no release with dataset assets found"; exit 1; }
          echo "dataset release: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Download + verify released dataset
        run: |
          mkdir -p data/normalized
          gh release download "${{ steps.ds.outputs.ref }}" \
            -p 'observations.parquet' -p 'sources.parquet' -p 'SHA256SUMS' \
            -D data/normalized --clobber
          cd data/normalized
          grep '\.parquet$' SHA256SUMS | sha256sum -c -

      - name: Build static site
        env:
          PSD2_DATASET_REF: ${{ steps.ds.outputs.ref }}
        run: uv run psd2-kpi-es site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist/
          retention-days: 30

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Pin VPS host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}

      - name: Deploy site/dist to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_DEPLOY_USER }}
          WEB_ROOT: ${{ vars.VPS_WEB_ROOT }}
          SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$WEB_ROOT"
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" \
            site/dist/ "$VPS_USER@$VPS_HOST:$WEB_ROOT/"

      - name: Smoke test deployed site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # The deploy is only green when the public site actually serves
          # the generated files — not just when rsync exits 0.
          test -n "$SITE_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --retry-all-errors "$SITE_URL/" > /dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --retry-all-errors "$SITE_URL/data/meta.json" | grep -q '"observations"'
          echo "smoke test passed: $SITE_URL"
