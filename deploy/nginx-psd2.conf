# Nginx server block for the static PSD2 KPI site.
# Adjust server_name + root, then `certbot --nginx -d <domain>` for HTTPS.

server {
    listen 80;
    server_name psd2.example.com;

    root /var/www/psd2-kpi-es;
    index index.html;

    # gzip for the JSON data files and text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # generated data + assets: cache briefly, safe to revalidate
    location /data/ {
        add_header Cache-Control "public, max-age=300";
    }
    location /static/ {
        add_header Cache-Control "public, max-age=3600";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
